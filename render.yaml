databases:
  - name: archon-db
    databaseName: archon
    user: archon
    plan: free

services:
  # ── API ──────────────────────────────────────────────────────────────────────
  - type: web
    name: archon-api
    runtime: node
    rootDir: .
    buildCommand: pnpm install --frozen-lockfile --filter @ots/api && pnpm --filter @ots/api run build
    startCommand: node apps/api/dist/index.js
    healthCheckPath: /health
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        fromDatabase:
          name: archon-db
          property: connectionString
      - key: RPC_URL
        sync: false
      - key: PRIVATE_KEY
        sync: false
      - key: CHAIN_ID
        value: "11155111"
      - key: CHAIN_NAME
        value: Sepolia
      - key: FUND_TOKEN_ADDRESS
        sync: false
      - key: NAV_REGISTRY_ADDRESS
        sync: false
      - key: OTC_TRADE_ADDRESS
        sync: false
      - key: API_KEY
        sync: false
      - key: CORS_ORIGIN
        sync: false

  # ── Web UI ───────────────────────────────────────────────────────────────────
  - type: web
    name: archon-web
    runtime: node
    rootDir: .
    buildCommand: pnpm install --frozen-lockfile --filter @ots/web && pnpm --filter @ots/web run build
    startCommand: node apps/web/.next/standalone/apps/web/server.js
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: HOSTNAME
        value: 0.0.0.0
      - key: NEXTAUTH_URL
        sync: false
      - key: NEXTAUTH_SECRET
        sync: false
      - key: AUTH_SECRET
        sync: false
      - key: NEXT_PUBLIC_API_URL
        sync: false
      - key: NEXT_PUBLIC_API_KEY
        sync: false
